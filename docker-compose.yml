services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: musfest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpassword
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musfest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:localdevpassword@db:5432/musfest
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: